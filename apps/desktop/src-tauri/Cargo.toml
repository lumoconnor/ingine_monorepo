[package]
name = "ingine-world"
version = "0.1.0"
description = "Ingine procedural open world (desktop prototype)"
edition = "2021"

[lib]
name = "ingine_world_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
