name: Desktop app

# Builds the Tauri desktop app (apps/desktop), which opens the procedural world, for
# macOS (one universal app for Apple silicon and Intel), Windows and Linux.
#
#   Pull requests:          build all three to prove they still build; installers are
#                           attached to the run as artifacts.
#   Push to main / manual:  also replace the "desktop-latest" pre-release, so the newest
#                           installers are always at .../releases/tag/desktop-latest
#
# The builds are unsigned (macOS gets an ad-hoc signature), so the first launch needs
# one extra click; apps/desktop/README.md says how.

on:
  push:
    branches: [main]
    paths: ['packages/engine/**', 'apps/sandbox/**', 'apps/desktop/**', 'package-lock.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', 'apps/sandbox/package.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Recreates the rolling pre-release at this commit before the builds upload to it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest --target "$GITHUB_SHA" --prerelease \
            --title "Desktop app (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download the file for your computer:

          - **Mac**: the \`.dmg\` (works on Apple silicon and Intel)
          - **Windows**: the \`-setup.exe\` (or the \`.msi\`)
          - **Linux**: the \`.AppImage\` (or the \`.deb\`)

          These builds are not signed, so the first launch needs one extra step. See apps/desktop/README.md."
          echo "id=$(gh release view desktop-latest --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    # Runs on pull requests too, where the release job is skipped.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            name: macos
          - os: windows-latest
            args: ''
            name: windows
          - os: ubuntu-22.04
            args: ''
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci

      # Builds the sandbox (opening the world), then the app and its installers.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}

      - uses: actions/upload-artifact@v4
        with:
          name: ingine-world-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
