name: Publish office-mp to GitHub Pages

# Every push to main rebuilds the multiplayer office test and publishes it,
# so anyone with the link can host or join a room. One-time setup: repo
# Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['packages/**', 'games/office-mp/**', 'package-lock.json', '.github/workflows/office-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:office
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/office-mp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
